# WHS Brief content routing
#
# This file is NOT part of the theme zip — Ghost applies routes.yaml at the
# site level, not the theme level. To use it:
#   - Local dev instance: copy to <ghost-content-dir>/settings/routes.yaml
#     and restart Ghost (`ghost restart`), OR
#   - Live Ghost(Pro) site: Settings > Advanced > Routes > upload this file.
#
# What this does:
#   - ALL posts get the same flat /{slug}/ permalink, via the single
#     unfiltered "/" collection below — Ghost's collections are mutually
#     exclusive (a post claimed by one collection's filter disappears from
#     any other, including an unfiltered one), so an earlier version of this
#     file that gave /blog/ and /brief/ their own permalink-claiming
#     collections caused the homepage to show ZERO posts once every post was
#     tagged #blog or #brief (both got claimed, leaving nothing for the
#     unfiltered "/" collection to list). Keeping permalinks on a single
#     collection avoids that trap.
#   - /blog/, /brief/, /register/, /industry-brief/ and /tracker/ are plain
#     routes (not collections) rendering the theme's blog.hbs / brief.hbs /
#     register.hbs / industry-brief.hbs / tracker.hbs templates, which
#     independently fetch posts via {{#get}} with a tag filter — pure
#     browsing views, with no effect on permalinks or on what the homepage
#     shows. /register/ additionally reorganises #brief posts' content
#     client-side by jurisdiction instead of by week — see register.hbs.
#     /industry-brief/ is the sibling monthly brief tagged #industry-brief
#     instead of #brief — see industry-brief.hbs. /tracker/ is the PUBLIC
#     (not paid-gated) headline-only change tracker, sourced from #tracker-
#     tagged posts, not #brief — see tracker.hbs. Do not confuse it with
#     /register/, which is paid-only and shows full item content.
#   - /jurisdiction/{slug}/ (nsw, vic, qld, wa, sa, tas, act, nt, nz) are 9
#     more plain routes, all sharing one jurisdiction.hbs template — the page
#     itself reads which slug it's on from the URL client-side, so there's no
#     per-jurisdiction template. Same #tracker-tagged, public data source as
#     /tracker/, just pre-filtered to one jurisdiction.
#   - The homepage (/) lists ALL posts together (mixed feed) — gated
#     #brief posts show with Ghost's built-in locked-card styling there,
#     which is what nudges free readers toward subscribing.
#
# Content access (Public / free members / paid members only) is set per-post
# in the editor's Access setting — routes.yaml only controls URL structure
# and which posts appear on which listing pages, not who can read them.
#
# Nav links to /blog/, /brief/ and /tracker/ are added separately in
# Ghost Admin > Design > Navigation (not part of routes.yaml).
#
# Like the rest of this file, the new /tracker/ and /jurisdiction/*/ routes
# only take effect once this file is re-uploaded at Ghost Admin > Settings >
# Advanced > Routes — pushing the theme repo does not do this automatically.

routes:
  /blog/:
    template: blog

  /brief/:
    template: brief

  /register/:
    template: register

  /industry-brief/:
    template: industry-brief

  /tracker/:
    template: tracker

  /jurisdiction/nsw/:
    template: jurisdiction

  /jurisdiction/vic/:
    template: jurisdiction

  /jurisdiction/qld/:
    template: jurisdiction

  /jurisdiction/wa/:
    template: jurisdiction

  /jurisdiction/sa/:
    template: jurisdiction

  /jurisdiction/tas/:
    template: jurisdiction

  /jurisdiction/act/:
    template: jurisdiction

  /jurisdiction/nt/:
    template: jurisdiction

  /jurisdiction/nz/:
    template: jurisdiction

collections:
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
