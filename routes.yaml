# WHS Brief content routing
#
# This file is NOT part of the theme zip — Ghost applies routes.yaml at the
# site level, not the theme level. To use it:
#   - Local dev instance: copy to <ghost-content-dir>/settings/routes.yaml
#     and restart Ghost (`ghost restart`), OR
#   - Live Ghost(Pro) site: Settings > Advanced > Routes > upload this file.
#
# What this does:
#   - ALL posts get the same flat /{slug}/ permalink, via either the
#     unfiltered "/" collection or the filtered "/tracker/" collection below
#     — Ghost's collections are mutually exclusive (a post claimed by one
#     collection's filter disappears from any other, including an unfiltered
#     one), so an earlier version of this file that gave /blog/ and /brief/
#     their own permalink-claiming collections caused the homepage to show
#     ZERO posts once every post was tagged #blog or #brief (both got
#     claimed, leaving nothing for the unfiltered "/" collection to list).
#     Keeping every collection's permalink on the same flat /{slug}/ pattern
#     avoids that trap while still letting a tag-filtered collection exclude
#     its posts from the homepage feed.
#   - /blog/, /brief/, /register/ and /industry-brief/ are plain routes (not
#     collections) rendering the theme's blog.hbs / brief.hbs / register.hbs
#     / industry-brief.hbs templates, which independently fetch posts via
#     {{#get}} with a tag filter — pure browsing views, with no effect on
#     permalinks or on what the homepage shows. /register/ additionally
#     reorganises #brief posts' content client-side by jurisdiction instead
#     of by week — see register.hbs. /industry-brief/ is the sibling monthly
#     brief tagged #industry-brief instead of #brief — see
#     industry-brief.hbs. Do not confuse either with /tracker/ below.
#   - /tracker/ IS a collection (filter: tag:tracker), not a plain route —
#     changed 2026-09-17 after #tracker-tagged posts (meant to be lightweight
#     headline-only teasers, see tracker.hbs) were found appearing in full,
#     un-gated, front-and-centre on the homepage feed, defeating the whole
#     point of tracker.hbs's own 5-item anonymous-visitor cap and giving away
#     free what the paywall is meant to nudge people to subscribe for. Being
#     a collection means Ghost claims #tracker posts out of the unfiltered
#     "/" collection entirely — they no longer appear on the homepage — while
#     keeping the same flat /{slug}/ permalink (no broken links) and the same
#     tracker.hbs template at /tracker/ itself (so the page's own gating
#     logic, and its {{#get filter="tag:tracker"}} data source, are
#     unaffected). It must be listed BEFORE the unfiltered "/" collection
#     below — Ghost claims posts into the first matching collection in file
#     order, so if "/" came first it would claim everything, including
#     #tracker posts, before "/tracker/" ever got a chance to filter them
#     out. NOTE: this only stops tracker posts appearing on the homepage
#     LISTING — visiting a tracker post's own URL directly still shows its
#     full (headline+date-only, no analysis) body with no cap, since that's
#     Ghost's normal single-post render, untouched by tracker.hbs's
#     JS-based gating. If that turns out to still feel like "too much for
#     free", the next fix would need to change what's IN each week's
#     #tracker post, not the routing.
#   - /jurisdiction/{slug}/ (nsw, vic, qld, wa, sa, tas, act, nt, nz) are 9
#     more plain routes, all sharing one jurisdiction.hbs template — the page
#     itself reads which slug it's on from the URL client-side, so there's no
#     per-jurisdiction template. Same #tracker-tagged, public data source as
#     /tracker/, just pre-filtered to one jurisdiction.
#   - The homepage (/) lists all NON-#tracker posts together (mixed feed) —
#     gated #brief posts show with Ghost's built-in locked-card styling
#     there, which is what nudges free readers toward subscribing.
#
# Content access (Public / free members / paid members only) is set per-post
# in the editor's Access setting — routes.yaml only controls URL structure
# and which posts appear on which listing pages, not who can read them.
#
# Nav links to /blog/, /brief/ and /tracker/ are added separately in
# Ghost Admin > Design > Navigation (not part of routes.yaml).
#
# Like the rest of this file, the new /tracker/ and /jurisdiction/*/ routes
# only take effect once this file is re-uploaded at Ghost Admin > Settings >
# Advanced > Routes — pushing the theme repo does not do this automatically.

routes:
  /blog/:
    template: blog

  /brief/:
    template: brief

  /register/:
    template: register

  /industry-brief/:
    template: industry-brief

  /jurisdiction/nsw/:
    template: jurisdiction

  /jurisdiction/vic/:
    template: jurisdiction

  /jurisdiction/qld/:
    template: jurisdiction

  /jurisdiction/wa/:
    template: jurisdiction

  /jurisdiction/sa/:
    template: jurisdiction

  /jurisdiction/tas/:
    template: jurisdiction

  /jurisdiction/act/:
    template: jurisdiction

  /jurisdiction/nt/:
    template: jurisdiction

  /jurisdiction/nz/:
    template: jurisdiction

collections:
  /tracker/:
    permalink: /{slug}/
    filter: tag:tracker
    template: tracker

  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
